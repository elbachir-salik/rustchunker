# Based on maturin's generated workflow, with release checks added.
name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: "1.83.0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Rust tools
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component clippy,rustfmt
      - name: Formatting
        run: cargo +${{ matrix.rust }} fmt --all -- --check
      - name: Compiler and Clippy checks
        run: cargo +${{ matrix.rust }} clippy --locked --all-targets -- -D warnings
      - name: Rust tests
        run: cargo +${{ matrix.rust }} test --locked --all-targets

  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          # Mainstream Linux targets. To also ship 32-bit / big-endian /
          # ARMv7 wheels, re-add: x86, armv7, s390x, ppc64le.
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist
      - uses: astral-sh/setup-uv@v7
        if: ${{ startsWith(matrix.platform.target, 'x86_64') }}
      - name: pytest
        if: ${{ startsWith(matrix.platform.target, 'x86_64') }}
        shell: bash
        run: |
          set -e
          uv venv .venv
          source .venv/bin/activate
          uv pip install rustchunker --no-index --no-deps --find-links dist --reinstall
          uv pip install rustchunker pytest
          pytest
      - name: pytest
        if: ${{ !startsWith(matrix.platform.target, 'x86') && matrix.platform.target != 'ppc64' }}
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: ${{ matrix.platform.target }}
          distro: ubuntu24.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-venv
          run: |
            set -e
            python3 -m venv .venv
            source .venv/bin/activate
            pip install pytest
            pip install rustchunker --no-index --no-deps --find-links dist --force-reinstall
            pip install rustchunker
            pytest

  # musllinux (Alpine) wheels omitted for v0.1.0 — musl users install from
  # the sdist (needs a Rust toolchain). Re-add a `musllinux` job with
  # `manylinux: musllinux_1_2` to ship prebuilt Alpine wheels.

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          # To also ship 32-bit / ARM64 Windows wheels, re-add:
          #   - { runner: windows-latest, target: x86, python_arch: x86 }
          #   - { runner: windows-11-arm, target: aarch64, python_arch: arm64 }
          - runner: windows-latest
            target: x64
            python_arch: x64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist
      - uses: astral-sh/setup-uv@v7
      - name: pytest
        shell: bash
        run: |
          set -e
          uv venv .venv
          source .venv/Scripts/activate
          uv pip install rustchunker --no-index --no-deps --find-links dist --reinstall
          uv pip install rustchunker pytest
          pytest

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist
      - uses: astral-sh/setup-uv@v7
      - name: pytest
        run: |
          set -e
          uv venv .venv
          source .venv/bin/activate
          uv pip install rustchunker --no-index --no-deps --find-links dist --reinstall
          uv pip install rustchunker pytest
          pytest

  python-compatibility:
    needs: [linux]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            os: ubuntu-22.04
          - python: "3.x"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v7
        with:
          name: wheels-linux-x86_64
          path: dist
      - uses: astral-sh/setup-uv@v7
      - name: Test the built wheel on the oldest and newest Python
        run: |
          uv venv --python "${{ steps.python.outputs.python-path }}" .venv
          source .venv/bin/activate
          uv pip install rustchunker --no-index --no-deps --no-build --find-links dist
          uv pip install pytest
          python -m pytest -q tests

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Build and test the source distribution
        run: |
          uv venv --python "${{ steps.python.outputs.python-path }}" .venv
          source .venv/bin/activate
          uv pip install pytest dist/*.tar.gz
          python -m pytest -q tests
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [rust, linux, windows, macos, python-compatibility, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'wheels-*/*'
      - name: Install uv
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        # Trusted publishing (OIDC): no token needed. `id-token: write` above
        # lets uv mint a short-lived credential from PyPI. Requires a
        # "pending publisher" configured once on PyPI for this repo + the
        # workflow file name (CI.yml) + environment (none).
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv publish --trusted-publishing always 'wheels-*/*'
