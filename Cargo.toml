[package]
name = "rustchunker"
version = "1.0.1"
edition = "2021"
rust-version = "1.83"
description = "A fast document chunking library for RAG pipelines"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elbachir-salik/rustchunker"
readme = "README.md"

[lib]
name = "_rustchunker"
crate-type = ["cdylib"]

[dependencies]
# Maturin enables extension-module; cargo test must link Python on Unix.
pyo3 = { version = "0.29", features = ["abi3-py39"] }
# pinned to 1.12.x: 1.13+ requires rustc 1.85, this toolchain is 1.83
unicode-segmentation = "~1.12"
rayon = "1"
scraper = "0.20"
pdf-extract = "0.8.2"
lopdf = { version = "0.34", default-features = false }
zip = { version = "~2.4.2", default-features = false, features = ["deflate-flate2", "flate2"] }
roxmltree = "0.20"

# The shipped wheel is always built --release. LTO + a single codegen unit
# give the optimizer whole-crate visibility (measurably helps the chunking
# hot paths); strip drops debug symbols to keep the wheel small. panic is
# left as the default "unwind" on purpose -- PyO3 catches Rust panics at the
# FFI boundary and turns them into Python exceptions; panic="abort" would
# instead kill the whole Python process.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
