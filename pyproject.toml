[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

[project]
name = "rustchunker"
version = "1.0.2"
description = "A fast document chunking library for RAG pipelines"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Salik Elbachir", email = "salik.elbachir@gmail.com" }]
keywords = ["rag", "chunking", "text-splitter", "nlp", "embeddings", "rust"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Linguistic",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/elbachir-salik/rustchunker"

[tool.maturin]
python-source = "python"
module-name = "rustchunker._rustchunker"
features = ["pyo3/extension-module"]
